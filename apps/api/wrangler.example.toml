name = "atlas"
main = "src/index.js"
compatibility_date = "2026-09-05"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

[[d1_databases]]
binding = "DB"
database_name = "atlas"
database_id = "<D1_DATABASE_ID>"
migrations_dir = "migrations"
